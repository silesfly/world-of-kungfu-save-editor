/* 5. 비파괴적 공용 UI 폴리싱 (레이아웃/높이/overflow 간섭 금지) */
html[data-hyup-skin="m1"] {
  accent-color: var(--accent);
  scrollbar-color: var(--hyup-sb-thumb) var(--hyup-sb-track);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

html[data-hyup-skin="m1"] body {
  font-family: var(--hyup-font-sans);
}

html[data-hyup-skin="m1"] :is(button, input, select, textarea) {
  font-family: inherit;
}

html[data-hyup-skin="m1"] :is(code, kbd, pre, samp) {
  font-family: var(--hyup-font-mono);
}

html[data-hyup-skin="m1"] ::selection {
  background: var(--hyup-selection-bg);
}

html[data-hyup-skin="m1"] :focus-visible {
  outline: 2px solid var(--hyup-focus-ring);
  outline-offset: 2px;
}

@supports not (scrollbar-color: auto) {
  html[data-hyup-skin="m1"],
  html[data-hyup-skin="m1"] * {
    scrollbar-width: auto;
  }

  html[data-hyup-skin="m1"]::-webkit-scrollbar,
  html[data-hyup-skin="m1"] *::-webkit-scrollbar {
    width: 12px;
    height: 12px;
  }

  html[data-hyup-skin="m1"]::-webkit-scrollbar-track,
  html[data-hyup-skin="m1"] *::-webkit-scrollbar-track {
    background: var(--hyup-sb-track);
  }

  html[data-hyup-skin="m1"]::-webkit-scrollbar-thumb,
  html[data-hyup-skin="m1"] *::-webkit-scrollbar-thumb {
    background: var(--hyup-sb-thumb);
    border-radius: 6px;
    border: 2px solid var(--hyup-sb-track);
  }
}

@media (prefers-reduced-motion: reduce) {
  html[data-hyup-skin="m1"] *,
  html[data-hyup-skin="m1"] *::before,
  html[data-hyup-skin="m1"] *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (forced-colors: active) {

<body>
  <header class="topbar">
    <div class="brand">
      <h1>대강호: 창룡과 백조 세이브 에디터 v1.1</h1>
      <div class="badges">
        <span id="file-badge" class="badge">파일 미로드</span>
        <span id="dirty-badge" class="badge badge-dirty" hidden>미저장 변경</span>
      </div>
      <button type="button" id="btn-theme" class="btn btn-sm">테마 전환</button>
    </div>
    <div id="native-bar" class="toolbar-row" hidden>
      <button type="button" id="btn-native-open" class="btn btn-sm">열기 (.dat)</button>
      <button type="button" id="btn-native-save" class="btn btn-sm">저장 (백업 생성)</button>
      <button type="button" id="btn-native-save-copy" class="btn btn-sm">다른 이름으로 저장</button>
    </div>
    <div id="server-bar" class="toolbar-row" hidden>
      <select id="server-save-select" aria-label="서버 세이브 파일 선택"></select>
      <button type="button" id="btn-server-load" class="btn btn-sm">불러오기</button>
      <button type="button" id="btn-server-save" class="btn btn-sm">서버 저장</button>
    </div>
    <div id="browser-bar" class="toolbar-row">
      <input type="file" id="file-input" accept=".dat" class="hidden">
      <button type="button" id="btn-file-open" class="btn btn-sm">파일 열기 (.dat)</button>
      <button type="button" id="btn-download-dat" class="btn btn-sm" disabled>다운로드 (.dat)</button>
      <button type="button" id="btn-load-demo" class="btn btn-sm">데모 세이브 체험</button>
    </div>
    <div id="status-msg" class="status-bar" role="status" aria-live="polite">세이브 파일을 열거나 데모 세이브 체험을 눌러 시작하세요.</div>
  </header>

  <nav class="tabs" role="tablist" aria-label="편집기 탭">
    <button type="button" role="tab" id="tab-btn-summary" aria-controls="panel-summary" aria-selected="true">요약 · 프리셋 · 재화</button>
    <button type="button" role="tab" id="tab-btn-chara" aria-controls="panel-chara" aria-selected="false">인물 · 능력치</button>
    <button type="button" role="tab" id="tab-btn-kungfu" aria-controls="panel-kungfu" aria-selected="false">무공 · 특성</button>
    <button type="button" role="tab" id="tab-btn-inventory" aria-controls="panel-inventory" aria-selected="false">장비 · 소지품</button>
    <button type="button" role="tab" id="tab-btn-party" aria-controls="panel-party" aria-selected="false">동료 · 파티 · 플래그</button>
    <button type="button" role="tab" id="tab-btn-atlas" aria-controls="panel-atlas" aria-selected="false">코드 도감 · 검증</button>
  </nav>

  <main>
    <section id="panel-summary" class="panel" role="tabpanel" aria-labelledby="tab-btn-summary">
      <div id="summary-cards" class="grid-cards"></div>
      <div id="preset-grid" class="preset-grid"></div>
      <div id="world-form" class="card"></div>
      <div id="world-extended-form" class="card"></div>
    </section>

    <section id="panel-chara" class="panel" role="tabpanel" aria-labelledby="tab-btn-chara" hidden>
      <div id="chara-toolbar" class="toolbar-row">
        <input id="chara-filter" type="search" placeholder="인물 검색...">
        <select id="chara-select" aria-label="인물 선택"></select>
      </div>
      <div id="chara-basic-box" class="card"></div>
      <div id="stat-group-bar" class="pill-list"></div>
      <div class="toolbar-row">
        <input id="stat-search" type="search" placeholder="능력치 이름/ID 검색...">
      </div>
      <div id="stat-table-wrap" class="table-wrap"></div>
    </section>

    <section id="panel-kungfu" class="panel" role="tabpanel" aria-labelledby="tab-btn-kungfu" hidden>
      <div id="kungfu-box" class="card"></div>
      <div id="trait-box" class="card"></div>
    </section>

    <section id="panel-inventory" class="panel" role="tabpanel" aria-labelledby="tab-btn-inventory" hidden>
      <div id="equip-slot-box" class="card slot-grid"></div>
      <div class="card">
        <div class="toolbar-row">
          <input id="inv-search" type="search" placeholder="아이템 검색...">
          <select id="inv-cat" aria-label="아이템 분류"></select>
          <button type="button" id="btn-add-item" class="btn btn-primary btn-sm">+ 아이템 추가</button>
        </div>
        <div id="inv-table-wrap" class="table-wrap"></div>
      </div>
      <div id="forged-box" class="card"></div>
    </section>

    <section id="panel-party" class="panel" role="tabpanel" aria-labelledby="tab-btn-party" hidden>
      <div class="split-layout">
        <div id="party-box" class="card"></div>
        <div class="card">
          <div class="toolbar-row">
            <input id="flag-search" type="search" placeholder="플래그 검색...">
          </div>
          <div id="flag-box"></div>
        </div>
      </div>
    </section>

    <section id="panel-atlas" class="panel" role="tabpanel" aria-labelledby="tab-btn-atlas" hidden>
      <div id="validate-box" class="card"></div>
      <div class="toolbar-row">
        <input id="atlas-search" type="search" placeholder="코드 도감·공식·키워드 검색...">
      </div>
      <div id="atlas-box" class="card"></div>
      <div id="raw-json-box" class="card"></div>
    </section>
  </main>

  <dialog id="picker-dialog" aria-labelledby="picker-title">
    <div class="toolbar-row">
      <h2 id="picker-title">항목 선택</h2>
      <button type="button" id="btn-picker-close" class="btn btn-sm">닫기</button>
    </div>
    <input id="picker-search" type="search" placeholder="한글·중문·영문·ID 검색...">
    <div id="picker-list" class="picker-list"></div>
  </dialog>

  <!-- BUNDLE_SCRIPTS_START -->
  <script src="catalog-data.js"></script>
  <script src="msgpack-codec.js"></script>
  <script src="editor-core.js"></script>
  <script src="editor-ui.js"></script>
  <!-- BUNDLE_SCRIPTS_END -->
</body>
</html>
